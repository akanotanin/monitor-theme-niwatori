<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Monitor hub 把主题挂在站点根目录；SPA 深链（/node/123）刷新时地址栏不是根，
     相对路径会按 /node/ 解析 → 样式、模块、接口全 404。一个 base 把相对地址钉回根目录。 -->
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ec850">
<title>Monitor</title>
<meta name="description" content="极简探针（Monitor）主题：把实时监控数据做成一座可玩的 3D 小鸡农场。" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css?v=1.0.22">
<link rel="stylesheet" href="./theme.css?v=1.0.22">
<!-- 首屏关键资源提前建连/预取：3D 引擎是最大的单个文件（671 KB），
     main.js 要等 theme-boot 的两次 fetch 之后才 import 它 —— 不 preload 的话这段时间网络空转。
     只给 three 加：它被所有模块共享，且体积最大、收益最确定。 -->
<link rel="modulepreload" href="./vendor/three.module.min.js">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module" src="./js/theme-boot.js?v=1.0.22"></script>
</head>
<body>
<div id="app"></div>

<!-- 首屏：3D 画布淡入前先显示这块（主模块里 showWorld 会把它收掉）
     内容是像素载入动画（js/loading.js），原来那行「🐔 正在布置农场…」的胶囊提示条
     保留了同一个元素 #boot，只是里面换成一颗 216×128 的画布 + 一行小字。 -->
<div id="boot">
  <div class="ld-stage">
    <canvas id="ld-canvas" width="216" height="128"></canvas>
    <p class="ld-tip">农场正在搭起来 …</p>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="topbar">
    <div class="stat" title="Monitor 里在线的节点数">🐔 探针鸡 在线 <b id="online">–</b><i> / <span id="online-total">–</span></i> 鸡</div>
    <div class="stat" title="ping 探测任务数：每个探测任务对应一只网站鸡">🌐 网站鸡 在线 <b id="web-online">–</b><i> / <span id="web-total">–</span></i> 鸡</div>
    <div class="stat" title="CPU/内存超阈值、或者网络最差的探针鸡：都会主动攻击你">🔥 暴躁鸡 <b id="hot">–</b> 只</div>
    <div class="stat dim" id="visitors" title="场上玩家">👤 访客 <b>1</b> 鸡</div>

    <div id="tools">
      <button id="btn-probes" type="button" title="探针列表（Tab）：这台站监控的所有服务器" aria-label="探针列表" aria-controls="plist" aria-expanded="false">🖥</button>
    </div>
  </div>

  <!-- 动态播报：读屏用户要能听到「被啄 / 断线 / 网络劣化」，内容本身仍是 textContent -->
  <div id="feed" aria-live="polite" aria-relevant="additions"></div>
  <div id="banner" role="status" aria-live="polite"></div>

  <!-- 右上啄倒榜：单机模式下换成自己的战绩（主题的 solo.js 负责喂数据）
       ⚠ 不能把整个容器设成 role="button"：它会让榜单里的每一行在无障碍树里被 presentational 化，
       读屏用户听不到「谁啄倒了谁」。改成「标题是个按钮、内容照常可读」。 -->
  <div id="board" class="collapsed">
    <h3 id="board-title"><button id="board-toggle" type="button" aria-expanded="false" aria-controls="board-rows">🐔 啄倒榜</button></h3>
    <div id="board-rows"></div>
  </div>

  <div id="me">
    <div id="me-name">–</div>
    <div id="hpbar" role="progressbar" aria-label="血量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="hpfill"></div></div>
    <div id="score"></div>
  </div>

  <div id="hint"></div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="t-peck">啄</button>
      <button id="t-jump">跳</button>
      <button id="t-run">跑</button>
    </div>
  </div>
</div>

<div id="errbar" class="hidden" role="alert" aria-live="assertive"></div>

<!-- 探针列表 / 详情：既是悬浮层（Tab），也是 /nodes 与 /node/<id> 路由的页面主体（theme-shell.js 切 class）。
     ⚠ 不声明 aria-modal="true"：这个面板没有焦点陷阱，Tab 还会被站点语义劫持成「开/关面板」——
     aria-modal 是对读屏的承诺（"外面不可交互"），在这里不成立。用 role="dialog" + 标签即可。 -->
<div id="plist" class="hidden" role="dialog" aria-labelledby="plist-title">
  <div class="sheet">
    <header>
      <button id="plist-back" class="hidden" type="button" title="返回列表" aria-label="返回列表">←</button>
      <h3 id="plist-title">🖥 探针列表</h3>
      <span id="plist-sum"></span>
      <a id="plist-admin" href="/admin/" title="管理后台（仅授权网络可访问）">⚙ 后台</a>
      <button id="plist-close" type="button" title="关闭（Tab / Esc）" aria-label="关闭">✕</button>
    </header>
    <div id="plist-body"></div>
    <div id="plist-detail" class="hidden"></div>
    <p class="note" id="plist-note">点任意一张卡片看这台机器的详情 · 数据每 6 秒刷新 · Tab 开关本面板</p>
    <p class="note" id="theme-credit">Theme: <a href="https://github.com/akanotanin/monitor-theme-niwatori" target="_blank" rel="noopener">Niwatori</a> · for Monitor.</p>
  </div>
</div>

<!-- 农场页脚：主题署名（Monitor 主题惯例「Theme: …」）；列表页也有一份。 -->
<p id="theme-footer">Theme: <a href="https://github.com/akanotanin/monitor-theme-niwatori" target="_blank" rel="noopener">Niwatori</a> · for Monitor.</p>
</body>
</html>
